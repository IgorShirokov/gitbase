<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" fill="none">
  <title>gitbase — Git на Go</title>
  <desc>Учебная система контроля версий. 22 урока, шесть команд, Go 1.24 и стандартная библиотека. Схема показывает основную ветку и отдельную ветку feature без слияния.</desc>
  <rect width="1600" height="480" rx="24" fill="#111820"/>
  <g stroke="#29404A" stroke-width="2" opacity="0.5">
    <path d="M0 80H180L220 120H340M1240 40H1440L1480 80H1600M0 410H110L150 450H350M1300 440H1460L1500 400H1600"/>
    <circle cx="340" cy="120" r="5" fill="#29404A"/>
    <circle cx="1240" cy="40" r="5" fill="#29404A"/>
    <circle cx="350" cy="450" r="5" fill="#29404A"/>
    <circle cx="1300" cy="440" r="5" fill="#29404A"/>
  </g>
  <g font-family="Segoe UI, DejaVu Sans, sans-serif">
    <text x="100" y="105" fill="#62DFC5" font-size="19" font-weight="700" letter-spacing="3">ПРАКТИЧЕСКИЙ КУРС НА GO</text>
    <text x="94" y="225" fill="#EDF4F5" font-size="112" font-weight="700" letter-spacing="-4">gitbase</text>
    <text x="100" y="285" fill="#A9BDC6" font-size="29">От первого файла — к истории и веткам</text>
    <g font-size="20" font-weight="600" text-anchor="middle">
      <rect x="100" y="342" width="150" height="46" rx="12" fill="#16232C" stroke="#29404A"/>
      <text x="175" y="372" fill="#62DFC5">Go 1.24+</text>
      <rect x="266" y="342" width="150" height="46" rx="12" fill="#16232C" stroke="#29404A"/>
      <text x="341" y="372" fill="#EDF4F5">22 урока</text>
      <rect x="432" y="342" width="150" height="46" rx="12" fill="#16232C" stroke="#29404A"/>
      <text x="507" y="372" fill="#EDF4F5">6 команд</text>
    </g>
  </g>
  <rect x="860" y="78" width="640" height="324" rx="20" fill="#16232C" stroke="#29404A" stroke-width="2"/>
  <g font-family="Consolas, DejaVu Sans Mono, monospace" font-size="22">
    <text x="904" y="132" fill="#A9BDC6">$ gitbase log</text>
    <text x="904" y="362" fill="#62DFC5">blob</text>
    <text x="983" y="362" fill="#A9BDC6">→</text>
    <text x="1022" y="362" fill="#62DFC5">tree</text>
    <text x="1101" y="362" fill="#A9BDC6">→</text>
    <text x="1140" y="362" fill="#62DFC5">commit</text>
    <text x="1218" y="199" fill="#62DFC5">main</text>
    <text x="1332" y="274" fill="#82B9EC">feature</text>
  </g>
  <path d="M930 190H1180" stroke="#62DFC5" stroke-width="5" stroke-linecap="round"/>
  <path d="M1055 190C1100 190 1100 265 1145 265H1294" stroke="#82B9EC" stroke-width="4" stroke-linecap="round"/>
  <g fill="#16232C" stroke="#62DFC5" stroke-width="5">
    <circle cx="930" cy="190" r="13"/>
    <circle cx="1055" cy="190" r="13"/>
    <circle cx="1180" cy="190" r="13"/>
  </g>
  <g fill="#16232C" stroke="#82B9EC" stroke-width="5">
    <circle cx="1170" cy="265" r="13"/>
    <circle cx="1294" cy="265" r="13"/>
  </g>
  <path d="M904 312H1456" stroke="#29404A" stroke-width="2"/>
</svg>
